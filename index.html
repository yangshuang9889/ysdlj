<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="favicon-link" rel="icon" type="image/svg+xml" href="/icons/icon-chain.svg" />
    <title>杨爽短链接系统</title>
    <script type="module" crossorigin src="/assets/index-hLWRzYiQ.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/vendor-2RH9FwCK.js">
    <link rel="modulepreload" crossorigin href="/assets/element-plus-B-5DJ08x.js">
    <link rel="stylesheet" crossorigin href="/assets/index-EQTwsGvA.css">
    <style>
      /* 后台入口浮动按钮 */
      #admin-entry {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
        display: none;
      }
      #admin-entry a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 12px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        border-radius: 25px;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        transition: all 0.3s ease;
      }
      #admin-entry a:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }
      #admin-entry .icon {
        font-size: 16px;
      }
    </style>
    <script>
      // 检查登录状态，显示后台入口
      function checkAdminEntry() {
        // 检查是否有 token（适配常见存储方式）
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const adminEntry = document.getElementById('admin-entry');
        if (token) {
          adminEntry.style.display = 'block';
        } else {
          adminEntry.style.display = 'none';
        }
      }
      
      // DOM 加载完成后检查
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkAdminEntry);
      } else {
        checkAdminEntry();
      }
      
      // 监听 storage 变化（登录/登出后）
      window.addEventListener('storage', checkAdminEntry);
      
      // 轮询检查（适配 Vue 应用内登录后设置 token）
      let checkCount = 0;
      const pollInterval = setInterval(() => {
        checkAdminEntry();
        checkCount++;
        if (checkCount > 20) clearInterval(pollInterval);
      }, 500);
      
      // 监听来自 Vue 应用的自定义事件
      window.addEventListener('user-login', checkAdminEntry);
      window.addEventListener('user-logout', checkAdminEntry);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 后台管理入口 -->
    <div id="admin-entry">
      <a href="/admin" title="进入后台管理">
        <span class="icon">⚙️</span>
        <span>后台管理</span>
      </a>
    </div>
  </body>
</html>
