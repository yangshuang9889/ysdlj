# ============================================================
# 极链 · 短链接系统 - 1Panel + OpenResty 配置
# 解决 502 Bad Gateway 问题
# ============================================================

server {
    listen 80;
    # 如需 HTTPS，取消下面注释
    # listen 443 ssl http2;
    # server_name your-domain.com;
    
    # SSL 配置（如需 HTTPS）
    # ssl_certificate     /www/sites/your-domain.com/ssl/fullchain.pem;
    # ssl_certificate_key /www/sites/your-domain.com/ssl/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    
    # 项目根目录 - 1Panel 默认路径
    root /www/sites/your-domain.com;  # 修改为你的实际域名路径
    index index.php index.html;
    
    # ============================================================
    # 关键：PHP-FPM 配置（解决 502 错误）
    # ============================================================
    
    # 方式 1：使用 Unix Socket（推荐，性能更好）
    # 注意：路径需要根据你的 PHP 版本调整
    # PHP 8.0: /run/php/php8.0-fpm.sock
    # PHP 8.1: /run/php/php8.1-fpm.sock
    # PHP 8.2: /run/php/php8.2-fpm.sock
    location ~ \.php$ {
        # 尝试多个可能的 PHP-FPM socket 路径
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        # 如果上面不行，尝试下面这个（1Panel 默认路径）
        # fastcgi_pass unix:/var/run/php/php-fpm.sock;
        # 或者使用 TCP 连接（如果 socket 不行）
        # fastcgi_pass 127.0.0.1:9000;
        
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # 超时设置
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
    
    # ============================================================
    # 短链接跳转规则
    # ============================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # ============================================================
    # 静态资源缓存优化
    # ============================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ============================================================
    # 安全配置
    # ============================================================
    
    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问配置文件
    location ~ /(config|app|database|storage) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问 .sql 文件
    location ~ \.sql$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ============================================================
    # 性能优化
    # ============================================================
    
    # 开启 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    
    # 客户端上传限制
    client_max_body_size 10M;
}

# ============================================================
# 502 错误排查指南
# ============================================================
# 
# 1. 检查 PHP-FPM 是否运行：
#    systemctl status php8.2-fpm
#    
# 2. 检查 PHP-FPM socket 是否存在：
#    ls -la /run/php/
#    
# 3. 检查 PHP-FPM 配置中的 listen 路径：
#    cat /etc/php/8.2/fpm/pool.d/www.conf | grep listen
#    
# 4. 检查 OpenResty 错误日志：
#    tail -f /var/log/openresty/error.log
#    
# 5. 检查权限：
#    ps aux | grep php-fpm
#    ps aux | grep openresty
#    # 确保两者使用相同的用户或有权限访问 socket
#
# 6. 如果使用 TCP 连接（127.0.0.1:9000）：
#    # 修改 php-fpm 配置：
#    # listen = 127.0.0.1:9000
#    # 然后重启 php-fpm
