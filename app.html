<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 杨爽短链接</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; }
        
        .layout { display: flex; min-height: 100vh; }
        
        /* 侧边栏 */
        .sidebar { width: 220px; background: #304156; color: #bfcbd9; position: fixed; left: 0; top: 0; bottom: 0; overflow-y: auto; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #1f2d3d; }
        .sidebar-header h2 { color: #409eff; font-size: 18px; }
        .sidebar-menu { padding: 10px 0; }
        .menu-item { padding: 15px 20px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; }
        .menu-item:hover { background: #263445; color: #fff; }
        .menu-item.active { background: #409eff; color: #fff; }
        .menu-icon { font-size: 16px; }
        
        /* 主内容区 */
        .main { flex: 1; margin-left: 220px; padding: 20px; }
        .header { background: white; padding: 15px 20px; margin: -20px -20px 20px -20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; color: #303133; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .logout-btn { padding: 6px 15px; background: #f56c6c; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        /* 内容卡片 */
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        
        /* 表格样式 */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #ebeef5; }
        th { background: #f5f7fa; color: #909399; font-weight: 500; }
        
        /* 按钮 */
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #409eff; color: white; }
        .btn-success { background: #67c23a; color: white; }
        .btn-danger { background: #f56c6c; color: white; }
        .btn-warning { background: #e6a23c; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        
        /* 状态标签 */
        .status-active { color: #67c23a; font-weight: 500; }
        .status-inactive { color: #f56c6c; font-weight: 500; }
        .global-tag { background: #409eff; color: white; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
        
        /* 模态框 */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        
        /* 表单 */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #606266; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; }
        .form-group textarea { height: 100px; resize: vertical; }
        .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 30px; }
        .form-actions .btn:first-child { background: #fff; border: 1px solid #dcdfe6; color: #606266; }
        
        /* 仪表盘统计 */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { font-size: 14px; color: #909399; margin-bottom: 10px; }
        .stat-card .number { font-size: 28px; font-weight: bold; color: #303133; }
        
        /* 消息提示 */
        .message { padding: 15px; border-radius: 4px; margin-bottom: 20px; display: none; }
        .message.show { display: block; }
        .message.error { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
        .message.success { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
        
        /* 页面切换 */
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>⚡ 杨爽后台</h2>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item active" onclick="switchPage('dashboard')">
                    <span class="menu-icon">📊</span> 仪表盘
                </div>
                <div class="menu-item" onclick="switchPage('links')">
                    <span class="menu-icon">🔗</span> 链接管理
                </div>
                <div class="menu-item" onclick="switchPage('ads')">
                    <span class="menu-icon">📢</span> 广告管理
                </div>
                <div class="menu-item" onclick="switchPage('settings')">
                    <span class="menu-icon">⚙️</span> 系统设置
                </div>
            </div>
        </div>
        
        <!-- 主内容区 -->
        <div class="main">
            <div class="header">
                <h1 id="pageTitle">仪表盘</h1>
                <div class="user-info">
                    <span id="username">管理员</span>
                    <button class="logout-btn" onclick="logout()">退出</button>
                </div>
            </div>
            
            <div id="message" class="message"></div>
            
            <!-- 仪表盘页面 -->
            <div id="page-dashboard" class="page active">
                <div class="stats">
                    <div class="stat-card">
                        <h3>总链接数</h3>
                        <div class="number" id="statLinks">-</div>
                    </div>
                    <div class="stat-card">
                        <h3>总点击数</h3>
                        <div class="number" id="statClicks">-</div>
                    </div>
                    <div class="stat-card">
                        <h3>活跃广告</h3>
                        <div class="number" id="statAds">-</div>
                    </div>
                </div>
                <div class="card">
                    <h3>系统信息</h3>
                    <p style="margin-top: 15px; color: #606266;">欢迎使用杨爽短链接管理系统</p>
                </div>
            </div>
            
            <!-- 链接管理页面 -->
            <div id="page-links" class="page">
                <div class="card">
                    <h3>链接管理</h3>
                    <p style="margin-top: 15px; color: #909399;">功能开发中...</p>
                </div>
            </div>
            
            <!-- 广告管理页面 -->
            <div id="page-ads" class="page">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3>广告管理</h3>
                        <button class="btn btn-primary" onclick="showCreateModal()">+ 新建广告</button>
                    </div>
                    <table id="adTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>名称</th>
                                <th>类型</th>
                                <th>倒计时(秒)</th>
                                <th>全局</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="adList"></tbody>
                    </table>
                    <div id="adEmpty" style="text-align: center; padding: 50px; color: #909399; display: none;">
                        暂无广告，点击上方按钮创建
                    </div>
                </div>
            </div>
            
            <!-- 系统设置页面 -->
            <div id="page-settings" class="page">
                <div class="card">
                    <h3>系统设置</h3>
                    <p style="margin-top: 15px; color: #909399;">功能开发中...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 广告编辑模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">新建广告</h2>
            <form id="adForm">
                <input type="hidden" id="adId">
                <div class="form-group">
                    <label>广告名称 *</label>
                    <input type="text" id="adName" required>
                </div>
                <div class="form-group">
                    <label>广告类型</label>
                    <select id="adType">
                        <option value="countdown">倒计时广告</option>
                        <option value="banner">横幅广告</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>广告内容 (HTML) *</label>
                    <textarea id="adContent" required></textarea>
                </div>
                <div class="form-group">
                    <label>图片URL</label>
                    <input type="text" id="adImageUrl" placeholder="可选，图片广告时使用">
                </div>
                <div class="form-group">
                    <label>跳转链接</label>
                    <input type="text" id="adLinkUrl" placeholder="可选，点击广告跳转的URL">
                </div>
                <div class="form-group">
                    <label>倒计时时长 (秒)</label>
                    <input type="number" id="adCountdown" value="5" min="1" max="300">
                </div>
                <div class="form-group">
                    <label>跳过模式</label>
                    <select id="adSkipMode">
                        <option value="auto">自动跳过</option>
                        <option value="manual">手动跳过</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>按钮文本</label>
                    <input type="text" id="adBtnText" placeholder="跳过广告（{countdown}秒）">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="adIsGlobal"> 设为全局广告
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="adStatus" checked> 启用
                    </label>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" onclick="hideModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api/admin';
        let token = localStorage.getItem('token');
        
        // 检查登录状态
        if (!token) {
            alert('请先登录');
            location.href = '/login';
        }
        
        // 获取用户信息
        async function loadUserInfo() {
            try {
                const res = await fetch('/api/user/info', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.code === 0 && data.data) {
                    document.getElementById('username').textContent = data.data.username || '管理员';
                }
            } catch (e) {
                console.error('加载用户信息失败', e);
            }
        }
        
        // 页面切换
        function switchPage(page) {
            // 更新菜单状态
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.menu-item').classList.add('active');
            
            // 切换页面
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
            
            // 更新标题
            const titles = {
                'dashboard': '仪表盘',
                'links': '链接管理',
                'ads': '广告管理',
                'settings': '系统设置'
            };
            document.getElementById('pageTitle').textContent = titles[page];
            
            // 加载数据
            if (page === 'ads') loadAds();
            if (page === 'dashboard') loadStats();
        }
        
        // 加载统计信息
        async function loadStats() {
            try {
                // 这里可以调用实际的API
                document.getElementById('statLinks').textContent = '-';
                document.getElementById('statClicks').textContent = '-';
                document.getElementById('statAds').textContent = '-';
            } catch (e) {
                console.error('加载统计失败', e);
            }
        }
        
        // 广告管理功能
        async function loadAds() {
            try {
                const res = await fetch(`${API_BASE}/ads`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.code === 0) {
                    renderAds(data.data);
                } else {
                    showMessage(data.msg || '加载失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误: ' + e.message, 'error');
            }
        }
        
        function renderAds(ads) {
            const tbody = document.getElementById('adList');
            const emptyDiv = document.getElementById('adEmpty');
            
            if (ads.length === 0) {
                document.getElementById('adTable').style.display = 'none';
                emptyDiv.style.display = 'block';
                return;
            }
            
            document.getElementById('adTable').style.display = 'table';
            emptyDiv.style.display = 'none';
            
            tbody.innerHTML = ads.map(ad => `
                <tr>
                    <td>${ad.id}</td>
                    <td>${escapeHtml(ad.name)}</td>
                    <td>${ad.type === 'countdown' ? '倒计时' : '横幅'}</td>
                    <td>${ad.countdown || '-'}</td>
                    <td>${ad.is_global == 1 ? '<span class="global-tag">全局</span>' : ''}</td>
                    <td class="${ad.status == 1 ? 'status-active' : 'status-inactive'}">${ad.status == 1 ? '启用' : '禁用'}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="editAd(${ad.id})">编辑</button>
                        <button class="btn ${ad.status == 1 ? 'btn-warning' : 'btn-success'} btn-sm" onclick="toggleStatus(${ad.id}, ${ad.status})">${ad.status == 1 ? '禁用' : '启用'}</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteAd(${ad.id})">删除</button>
                    </td>
                </tr>
           `).join('');
        }
        
        function showCreateModal() {
            document.getElementById('modalTitle').textContent = '新建广告';
            document.getElementById('adForm').reset();
            document.getElementById('adId').value = '';
            document.getElementById('adStatus').checked = true;
            document.getElementById('modal').classList.add('show');
        }
        
        async function editAd(id) {
            try {
                const res = await fetch(`${API_BASE}/ads`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const ad = data.data.find(a => a.id == id);
                if (!ad) return;
                
                document.getElementById('modalTitle').textContent = '编辑广告';
                document.getElementById('adId').value = ad.id;
                document.getElementById('adName').value = ad.name;
                document.getElementById('adType').value = ad.type;
                document.getElementById('adContent').value = ad.content;
                document.getElementById('adImageUrl').value = ad.image_url || '';
                document.getElementById('adLinkUrl').value = ad.link_url || '';
                document.getElementById('adCountdown').value = ad.countdown || 5;
                document.getElementById('adSkipMode').value = ad.skip_mode || 'auto';
                document.getElementById('adBtnText').value = ad.btn_text || '';
                document.getElementById('adIsGlobal').checked = ad.is_global == 1;
                document.getElementById('adStatus').checked = ad.status == 1;
                
                document.getElementById('modal').classList.add('show');
            } catch (e) {
                showMessage('加载失败: ' + e.message, 'error');
            }
        }
        
        document.getElementById('adForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('adId').value;
            const data = {
                name: document.getElementById('adName').value,
                type: document.getElementById('adType').value,
                content: document.getElementById('adContent').value,
                image_url: document.getElementById('adImageUrl').value,
                link_url: document.getElementById('adLinkUrl').value,
                countdown: parseInt(document.getElementById('adCountdown').value),
                skip_mode: document.getElementById('adSkipMode').value,
                btn_text: document.getElementById('adBtnText').value,
                is_global: document.getElementById('adIsGlobal').checked ? 1 : 0,
                status: document.getElementById('adStatus').checked ? 1 : 0,
            };
            
            try {
                const url = id ? `${API_BASE}/ads/${id}` : `${API_BASE}/ads`;
                const method = id ? 'PUT' : 'POST';
                
                const res = await fetch(url, {
                    method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await res.json();
                if (result.code === 0) {
                    hideModal();
                    showMessage(id ? '更新成功' : '创建成功', 'success');
                    loadAds();
                } else {
                    showMessage(result.msg || '操作失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误: ' + e.message, 'error');
            }
        });
        
        async function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus == 1 ? 0 : 1;
            if (!confirm(`确定要${newStatus == 1 ? '启用' : '禁用'}这个广告吗？`)) return;
            
            try {
                const res = await fetch(`${API_BASE}/ads/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                const result = await res.json();
                if (result.code === 0) {
                    showMessage('操作成功', 'success');
                    loadAds();
                } else {
                    showMessage(result.msg || '操作失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误: ' + e.message, 'error');
            }
        }
        
        async function deleteAd(id) {
            if (!confirm('确定要删除这个广告吗？')) return;
            
            try {
                const res = await fetch(`${API_BASE}/ads/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const result = await res.json();
                if (result.code === 0) {
                    showMessage('删除成功', 'success');
                    loadAds();
                } else {
                    showMessage(result.msg || '删除失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误: ' + e.message, 'error');
            }
        }
        
        function hideModal() {
            document.getElementById('modal').classList.remove('show');
        }
        
        function showMessage(msg, type) {
            const div = document.getElementById('message');
            div.textContent = msg;
            div.className = 'message show ' + type;
            setTimeout(() => div.classList.remove('show'), 3000);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function logout() {
            localStorage.removeItem('token');
            location.href = '/login';
        }
        
        // 初始加载
        loadUserInfo();
        loadStats();
    </script>
</body>
</html>
