server {
    listen 80;
    listen 443 ssl http2;
    server_name csdlj.xn--yrv04v.com;
    index index.php index.html;
    access_log /www/sites/csdlj.xn--yrv04v.com/log/access.log main;
    error_log /www/sites/csdlj.xn--yrv04v.com/log/error.log;
    root /www/sites/csdlj.xn--yrv04v.com/index;

    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) { return 404; }
    location ^~ /.well-known/acme-challenge { allow all; root /usr/share/nginx/html; }

    # Uploaded files - allow access
    location ^~ /storage/uploads/ { expires 365d; add_header Cache-Control "public"; }

    # Static assets - serve directly
    location ^~ /assets/ { expires 365d; add_header Cache-Control "public, immutable"; access_log off; }
    location ^~ /icons/ { expires 30d; access_log off; }
    location ^~ /dist/ { expires 365d; add_header Cache-Control "public, immutable"; access_log off; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ { expires 365d; add_header Cache-Control "public, immutable"; access_log off; }

    # API requests - send to PHP
    location ^~ /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # Admin API requests - send to PHP
    location ^~ /admin/api/ {
        try_files $uri /index.php$is_args$args;
    }

    # Install page - send to PHP for setup wizard
    location ^~ /install {
        try_files $uri /index.php$is_args$args;
    }

    # Frontend SPA routes - must be BEFORE short link regex
    location ~ "^/(login|register|dashboard|my-links|query)$" {
        try_files $uri $uri/ /index.html$is_args$args;
    }

    # Admin panel - use app.html
location ~ "^/admin/?$" {        try_files /admin.html =404;    }

    # Short links (alpha-numeric codes 4-32 chars) - send to PHP for redirect
    # NOTE: Must be AFTER frontend routes
    location ~ "^/[a-zA-Z0-9_-]{4,32}$" {
        try_files $uri /index.php$is_args$args;
    }

    # Security: deny sensitive dirs
    location ~ ^/(config|app|database) { deny all; }
    location ~ ^/storage/(?!uploads) { deny all; }
    location ~ \.(sql|bak|log|env)$ { deny all; }

    # SPA routes -> Vue index.html (catch-all)
    location / {
        try_files $uri $uri/ /index.html$is_args$args;
    }

    # PHP-FPM
    location ~ [^/]\.php(/|$) {
        fastcgi_pass 127.0.0.1:9001;
        include fastcgi-php.conf;
        include fastcgi_params;
        set $real_script_name $fastcgi_script_name;
        if ( $fastcgi_script_name ~ "^(.+?\.php)(/.+)$" ) {
            set $real_script_name $1;
            set $path_info $2;
        }
        fastcgi_param SCRIPT_FILENAME $document_root$real_script_name;
        fastcgi_param SCRIPT_NAME $real_script_name;
        fastcgi_param PATH_INFO $path_info;
    }

    if ( $scheme = http ) { return 301 https://$host$request_uri; }
    ssl_certificate /www/sites/csdlj.xn--yrv04v.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/csdlj.xn--yrv04v.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    proxy_set_header X-Forwarded-Proto https;
    add_header Strict-Transport-Security "max-age=31536000";
}
